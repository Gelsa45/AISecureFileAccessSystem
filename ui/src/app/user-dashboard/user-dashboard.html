<div class="dashboard-container">

  <h1>Secure File Access</h1>

  <p class="welcome">
    Welcome, {{ userName }}
  </p>

  <h2>Available Files</h2>

  <div class="files-grid">

    <div class="file-card" *ngFor="let file of files">

      <div class="file-name">
        📄 {{ file.name }}
      </div>

      <button
        class="open-btn"
        (click)="accessFile(file.id)">
        Open File
      </button>

    </div>

  </div>

</div>
