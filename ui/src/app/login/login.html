<div class="login-container">

  <div class="login-card">

    <h1>AI Secure File Access System</h1>

    <input
      [(ngModel)]="username"
      placeholder="Username">

    <input
      [(ngModel)]="password"
      type="password"
      placeholder="Password">

    <button (click)="login()">
      Sign In
    </button>

  </div>

</div>
