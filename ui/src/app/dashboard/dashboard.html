<div class="container">

  <h2>AI Secure File Access Dashboard</h2>

  <button (click)="clearLogs()">
    Reset Activity Logs
  </button>

  <hr>

  <p>Total Activities: {{ totalActivities }}</p>
  <p>High Risk Alerts: {{ highRiskAlerts }}</p>

  <h3>Recent Activity Logs</h3>

  <table border="1" *ngIf="activityLogs.length > 0">

    <tr>
      <th>User</th>
      <th>File</th>
      <th>Access Time</th>
    </tr>

    <tr *ngFor="let log of activityLogs">
      <td>{{ log.userName }}</td>
      <td>{{ log.fileName }}</td>
      <td>{{ log.accessTime }}</td>
    </tr>

  </table>

</div>
